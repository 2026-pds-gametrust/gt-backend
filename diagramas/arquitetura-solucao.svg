<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">GamerTrust  Arquitetura da solução (backend + frontend-web)</title>
  <desc id="desc">Navegador acessa o frontend-web, que chama o gt-backend por REST e Socket.IO. O backend persiste em MongoDB, armazena mídia no S3 e publica eventos em SNS/SQS.</desc>
  <rect width="1400" height="900" fill="#FBFCFC"/>
  <text x="700" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1B2631">Figura 1  Arquitetura da solução (backend + frontend-web)</text>

  <!-- Cliente -->
  <rect x="60" y="80" width="240" height="170" rx="8" fill="#F8F9F9" stroke="#7B7D7D" stroke-width="1.5"/>
  <text x="180" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2C3E50">Cliente</text>
  <rect x="90" y="128" width="180" height="90" rx="10" fill="#D5F5E3" stroke="#1E8449" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#145A32">Navegador</text>
  <text x="180" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#145A32">Chrome / Safari / Firefox</text>

  <!-- Web -->
  <rect x="380" y="80" width="300" height="170" rx="8" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.5"/>
  <text x="530" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A5276">Canal web</text>
  <rect x="410" y="124" width="240" height="100" rx="10" fill="#D6EAF8" stroke="#1A5276" stroke-width="1.5"/>
  <text x="530" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A5276">frontend-web</text>
  <text x="530" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1A5276">React + TypeScript + Vite</text>
  <text x="530" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1A5276">FSD 01-app & 06-shared · :5173</text>

  <!-- API -->
  <rect x="760" y="80" width="580" height="290" rx="8" fill="#E8F8F5" stroke="#148F77" stroke-width="1.5"/>
  <text x="1050" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E6655">API GamerTrust</text>
  <rect x="790" y="128" width="250" height="120" rx="10" fill="#D5F5E3" stroke="#0E6655" stroke-width="1.5"/>
  <text x="915" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E6655">gt-backend</text>
  <text x="915" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0E6655">Node.js + Express + TypeScript</text>
  <text x="915" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0E6655">OpenAPI (service.yaml)</text>
  <text x="915" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0E6655">Monólito modular · :3000</text>
  <rect x="1060" y="128" width="250" height="120" rx="10" fill="#EAFAF1" stroke="#196F3D" stroke-width="1.5"/>
  <text x="1185" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#196F3D">Camadas</text>
  <text x="1185" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196F3D">Application · Domain</text>
  <text x="1185" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196F3D">Infraestructure</text>
  <text x="1185" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196F3D">Configuration</text>
  <rect x="790" y="268" width="520" height="78" rx="10" fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5"/>
  <text x="1050" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D6608">Módulos: identity · catalog · listings · verification · trust</text>
  <text x="1050" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D6608">search · favorites · media · listing-chat · orders · ai</text>

  <!-- Nota -->
  <rect x="60" y="280" width="300" height="110" rx="6" fill="#FDEDEC" stroke="#C0392B" stroke-width="1.2"/>
  <text x="80" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7B241C">O frontend-web não acessa MongoDB</text>
  <text x="80" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7B241C">nem S3. Selos, TrustScore e</text>
  <text x="80" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7B241C">publicação são decisões do backend.</text>

  <!-- Infra -->
  <rect x="380" y="520" width="960" height="220" rx="8" fill="#F5EEF8" stroke="#7D3C98" stroke-width="1.5"/>
  <text x="860" y="552" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B2C6F">Infraestrutura de dados e mensageria</text>
  <rect x="420" y="576" width="260" height="120" rx="10" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
  <text x="550" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7D4E09">MongoDB 7</text>
  <text x="550" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">Documentos de domínio</text>
  <text x="550" y="664" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">e read models (busca)</text>
  <rect x="730" y="576" width="260" height="120" rx="10" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
  <text x="860" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7D4E09">S3 / LocalStack</text>
  <text x="860" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">Mídia e evidências</text>
  <text x="860" y="664" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">URL pré-assinada</text>
  <rect x="1040" y="576" width="260" height="120" rx="10" fill="#FDEBD0" stroke="#B9770E" stroke-width="1.5"/>
  <text x="1170" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7D4E09">SNS / SQS</text>
  <text x="1170" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">Eventos entre módulos</text>
  <text x="1170" y="664" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D4E09">listing.published ’ search</text>

  <!-- Setas -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A5276"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E6655"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9770E"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C3483"/>
    </marker>
  </defs>
  <line x1="270" y1="173" x2="378" y2="173" stroke="#1A5276" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="324" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1A5276">HTTPS</text>
  <line x1="650" y1="173" x2="788" y2="173" stroke="#0E6655" stroke-width="2.2" marker-end="url(#arrowG)"/>
  <text x="720" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0E6655">REST · OpenAPI</text>
  <path d="M 530 250 C 530 310, 915 310, 915 248" fill="none" stroke="#6C3483" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowP)"/>
  <text x="720" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6C3483">Socket.IO (chat)</text>
  <line x1="915" y1="370" x2="550" y2="574" stroke="#B9770E" stroke-width="2" marker-end="url(#arrowO)"/>
  <line x1="915" y1="370" x2="860" y2="574" stroke="#B9770E" stroke-width="2" marker-end="url(#arrowO)"/>
  <line x1="915" y1="370" x2="1170" y2="574" stroke="#B9770E" stroke-width="2" marker-end="url(#arrowO)"/>

  <text x="700" y="870" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#5D6D7E">GamerTrust · Entrega 4  Metodologia · IFPR PDS 2026</text>
</svg>
