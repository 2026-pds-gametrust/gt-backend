components:
  parameters:
    XUserIdHeader:
      name: x-user-id
      in: header
      required: false
      description: Not trusted as identity. Actor comes from the Bearer access token.
      schema:
        type: string
    XUserGroupsHeader:
      name: x-user-groups
      in: header
      required: false
      description: Not trusted as identity. Groups come from the Bearer access token.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by POST /auth/register, /auth/login or /auth/refresh
  responses:
    Unauthorized:
      description: Missing, malformed, expired, invalid or logout-revoked Bearer token — AUTH_UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TranslatedApiError'
    Forbidden:
      description: Authenticated caller is not in an allowed group
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMiddlewareError'
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthThrottled:
      description: Auth throttle exhausted — generic limiter body, not an identifier oracle
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthRateLimitError'
  schemas:
    AuthMiddlewareError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Error message from authorization middleware
          example: 'Access denied'
    AuthRateLimitError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: Generic throttle message with no email, CPF, or RESOURCE_CONFLICT
          example: 'Too many requests, please try again later.'
    TranslatedApiError:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Localized error message (from error catalog)
        code:
          type: string
          description: Stable machine-readable error code
          example: 'RESOURCE_NOT_FOUND'
        contextInfo:
          type: object
          description: Optional extra context from the service layer
          additionalProperties: true
    User:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - cpf
        - birthDate
        - verified
        - phoneVerified
        - status
        - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        cpf:
          type: string
          description: 11 digits; never included in domain events
        birthDate:
          type: string
          format: date
          description: YYYY-MM-DD
        verified:
          type: boolean
        phoneVerified:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, BLOCKED, PENDING_VERIFICATION]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        groups:
          type: array
          description: HTTP-assignable groups; empty when unset. Never includes SYSTEM.
          items:
            type: string
            enum: [app-user, partner, admin, backoffice]
    GeoPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: '[longitude, latitude]'
    Address:
      type: object
      required:
        - id
        - recipientName
        - postalCode
        - street
        - number
        - district
        - city
        - state
        - country
      properties:
        id:
          type: string
        label:
          type: string
        recipientName:
          type: string
        postalCode:
          type: string
          description: CEP 8 digits
        street:
          type: string
          description: Omitted or blank on public profile reads
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        country:
          type: string
          default: BR
        isBilling:
          type: boolean
        isShipping:
          type: boolean
        geo:
          $ref: '#/components/schemas/GeoPoint'
          description: Present for owner/backoffice; omitted on public reads
        geoSource:
          type: string
          enum: [BRASIL_API, NOMINATIM]
    CepLookupResult:
      type: object
      required:
        - postalCode
        - city
        - state
      properties:
        postalCode:
          type: string
        street:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
        geo:
          $ref: '#/components/schemas/GeoPoint'
    ProfileNear:
      type: object
      required:
        - id
        - userId
        - createdAt
        - distanceMeters
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        distanceMeters:
          type: number
    Profile:
      type: object
      required:
        - id
        - userId
        - addresses
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewProfile:
      type: object
      required:
        - id
        - userId
        - addresses
        - defaultShippingAddressId
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
    UpdateProfile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
    Category:
      type: object
      required:
        - id
        - slug
        - name
        - synonyms
        - status
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewCategory:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    UpdateCategory:
      type: object
      properties:
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    ServiceTaxonomy:
      type: object
      required:
        - id
        - slug
        - name
        - synonyms
        - status
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewServiceTaxonomy:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    UpdateServiceTaxonomy:
      type: object
      properties:
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    AttributeDef:
      type: object
      required:
        - key
        - name
        - valueType
        - required
        - filterable
        - facetOn
      properties:
        key:
          type: string
        name:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM]
        required:
          type: boolean
        filterable:
          type: boolean
        facetOn:
          type: string
          enum: [PRODUCT, LISTING, BOTH]
        enumValues:
          type: array
          items:
            type: string
        unit:
          type: string
