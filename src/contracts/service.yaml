openapi: 3.0.2
info:
  title: Example API
  description: This is a sample API to demonstrate OpenAPI specification.
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server
  - url: http://localhost

tags:
  - name: Auth
    description: First-party register, login, refresh, logout and current user
  - name: Users
    description: User management operations
  - name: CEP
    description: Brazilian postal code lookup (BrasilAPI)
  - name: Profiles
    description: Identity profile and shipping addresses
  - name: Catalog
    description: Catalog taxonomy and products
  - name: Listings
    description: Marketplace listings and listing events
  - name: Verification
    description: Verification cases, evidence and seals
  - name: Trust
    description: Trust events, scores and seller levels
  - name: Search
    description: Search documents, synonyms and query observability
  - name: Favorites
    description: User favorites for products and listings
  - name: Media
    description: Image upload grants, processing status and content grants
  - name: AI
    description: Listing quality analysis and validation scores

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: Register a marketplace member and issue a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAuthRegistration'
      responses:
        '201':
          description: Registered with access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Validation error or USER_UNDERAGE / FIELD_INVALID (including duplicate identifier)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '429':
          $ref: '#/components/responses/AuthThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: AUTH_INVALID_CREDENTIALS (unknown email, wrong password, no credential, or BLOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '429':
          $ref: '#/components/responses/AuthThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
        - Auth
      security: []
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefresh'
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: AUTH_INVALID_CREDENTIALS (unknown, expired, revoked/reuse, or BLOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '429':
          $ref: '#/components/responses/AuthThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke this session's refresh token and invalidate its access token
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Return the authenticated public User
      responses:
        '200':
          description: Public User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found — RESOURCE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      tags:
        - Catalog
      security: []
      summary: List categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Catalog
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMiddlewareError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{id}:
    get:
      tags:
        - Catalog
      security: []
      summary: Get category by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Catalog
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services:
    get:
      tags:
        - Catalog
      security: []
      summary: List taxonomy services
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceTaxonomy'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Catalog
      summary: Create taxonomy service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceTaxonomy'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTaxonomy'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMiddlewareError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /services/{id}:
    get:
      tags:
        - Catalog
      security: []
      summary: Get taxonomy service by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTaxonomy'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Catalog
      summary: Update taxonomy service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceTaxonomy'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTaxonomy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/{categoryId}/attribute-schema:
    get:
      tags:
        - Catalog
      security: []
      summary: Get category attribute schema
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schema found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Catalog
      summary: Upsert category attribute schema
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCategoryAttributeSchema'
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeSchema'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    get:
      tags:
        - Catalog
      security: []
      summary: List products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Catalog
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{id}:
    get:
      tags:
        - Catalog
      security: []
      summary: Get product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Catalog
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProduct'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{productId}/price-history:
    get:
      tags:
        - Catalog
      security: []
      summary: List price history for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Price history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistory'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /listings:
    get:
      tags:
        - Listings
      security: []
      summary: List verified public listings
      description: >
        Returns paginated PUBLISHED listings with an active GRANTED seal.
        Optional sellerId returns an array — owner/backoffice see all statuses for
        that seller; other callers see only verified listings for that seller.
      parameters:
        - name: sellerId
          in: query
          required: false
          schema:
            type: string
          description: Filter by seller; non-owners receive verified listings only
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Verified listing page or seller-filtered list
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ListingPage'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Listing'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Listings
      summary: Create listing draft
      description: >
        Creates a DRAFT listing. After resolving media assets, at least one
        public photo and one public video are required (via assetIds/videoAssetId
        or legacy photoUrls/videoUrl).
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewListing'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          description: Invalid media, shipping, or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '403':
          description: Actor is not the seller and not backoffice/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '404':
          description: Seller or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /listings/mine:
    get:
      tags:
        - Listings
      summary: List authenticated seller's own listings
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, PUBLISHED, PAUSED, EXPIRED, RESERVED, SOLD, REJECTED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Seller inventory page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerListingPage'
        '400':
          description: Invalid filter or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /listings/{id}:
    get:
      tags:
        - Listings
      security: []
      summary: Get listing by id
      description: >
        Public callers see only PUBLISHED listings with an active GRANTED seal.
        The listing owner and BACKOFFICE/ADMIN may read any status. Others receive 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Listing found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Listings
      summary: Update listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListing'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          description: Invalid media attachment or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '403':
          description: Actor is not the seller and not backoffice/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /listings/{id}/submit:
    post:
      tags:
        - Listings
      summary: Submit listing for verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          description: Invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '403':
          description: Actor is not the seller and not backoffice/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
  /listings/{id}/publish:
    post:
      tags:
        - Listings
      summary: Publish listing (MVP backoffice gate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMiddlewareError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
  /listings/{id}/pause:
    post:
      tags:
        - Listings
      summary: Pause published listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserIdHeader'
        - $ref: '#/components/parameters/XUserGroupsHeader'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '403':
          description: Actor is not the seller and not backoffice/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
