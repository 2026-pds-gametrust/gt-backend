  /media/uploads/{id}/complete:
    post:
      tags:
        - Media
      security: []
      summary: Confirm the object arrived and start processing
      description: >
        Marks the upload as received and enqueues processing. Processing is
        **asynchronous**: the response normally carries `status: UPLOADED`, and the
        asset only becomes `READY` after the `media.asset.uploaded` event is consumed
        (variants generated and stored).

        An asset can only be attached to a listing or product once it is `READY` —
        attaching an `UPLOADED` asset is rejected with 400. Clients must poll
        `GET /media/assets/{id}` until `status` is `READY` (or `FAILED`) before
        referencing the asset in `POST /listings` or `POST /products`.

        The response may already show `READY` when in-process dispatch is enabled
        (`EVENT_INPROCESS_DISPATCH=true`, the default in tests), so clients must not
        rely on that timing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserIdHeader'
      responses:
        '200':
          description: >
            Asset after complete. Normally `UPLOADED`; `READY` only under in-process
            dispatch. Poll GET /media/assets/{id} before attaching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '400':
          description: Object missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedApiError'
