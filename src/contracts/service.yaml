components:
  parameters:
    XUserIdHeader:
      name: x-user-id
      in: header
      required: false
      description: Authenticated actor id used for ownership (ActorContext.actorId)
      schema:
        type: string
    XUserGroupsHeader:
      name: x-user-groups
      in: header
      required: false
      description: Comma-separated groups (same format as authorizeByGroup)
      schema:
        type: string
  schemas:
    AuthMiddlewareError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message from authorization middleware
          example: 'Missing x-user-groups header'
    TranslatedApiError:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Localized error message (from error catalog)
        code:
          type: string
          description: Stable machine-readable error code
          example: 'RESOURCE_NOT_FOUND'
        contextInfo:
          type: object
          description: Optional extra context from the service layer
          additionalProperties: true
    User:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - cpf
        - birthDate
        - verified
        - phoneVerified
        - status
        - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        cpf:
          type: string
          description: 11 digits; never included in domain events
        birthDate:
          type: string
          format: date
          description: YYYY-MM-DD
        verified:
          type: boolean
        phoneVerified:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, BLOCKED, PENDING_VERIFICATION]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Address:
      type: object
      required:
        - id
        - recipientName
        - postalCode
        - street
        - number
        - district
        - city
        - state
        - country
      properties:
        id:
          type: string
        label:
          type: string
        recipientName:
          type: string
        postalCode:
          type: string
          description: CEP 8 digits
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        country:
          type: string
          default: BR
        isBilling:
          type: boolean
        isShipping:
          type: boolean
    Profile:
      type: object
      required:
        - id
        - userId
        - addresses
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewProfile:
      type: object
      required:
        - id
        - userId
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
    UpdateProfile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        locationApprox:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        defaultShippingAddressId:
          type: string
        setupItems:
          type: array
          items:
            type: object
            additionalProperties: true
    Category:
      type: object
      required:
        - id
        - slug
        - name
        - synonyms
        - status
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewCategory:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    UpdateCategory:
      type: object
      properties:
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    ServiceTaxonomy:
      type: object
      required:
        - id
        - slug
        - name
        - synonyms
        - status
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewServiceTaxonomy:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    UpdateServiceTaxonomy:
      type: object
      properties:
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    AttributeDef:
      type: object
      required:
        - key
        - name
        - valueType
        - required
        - filterable
        - facetOn
      properties:
        key:
          type: string
        name:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM]
        required:
          type: boolean
        filterable:
          type: boolean
        facetOn:
          type: string
          enum: [PRODUCT, LISTING, BOTH]
        enumValues:
          type: array
          items:
            type: string
        unit:
          type: string
        maxLength:
          type: number
        allowVariations:
          type: boolean
        group:
          type: string
    CategoryAttributeSchema:
      type: object
      required:
        - id
        - categoryId
        - attributes
        - version
        - createdAt
      properties:
        id:
          type: string
        categoryId:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertCategoryAttributeSchema:
      type: object
      required:
        - attributes
      properties:
        id:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
    Product:
      type: object
      required:
        - id
        - categoryId
        - brand
        - model
        - slug
        - status
        - createdAt
      properties:
        id:
          type: string
        categoryId:
          type: string
        brand:
          type: string
        model:
          type: string
        series:
          type: string
        slug:
          type: string
        mpn:
          type: string
        ean:
          type: string
        sku:
          type: string
        specs:
          type: object
          additionalProperties: true
        imageUrls:
          type: array
          items:
            type: string
