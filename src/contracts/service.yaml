          example: 400
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/users'
        errors:
          type: array
          description: List of specific validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
                example: 'email'
              message:
                type: string
                description: The validation error message
                example: 'Email is required'
              value:
                type: string
                description: The invalid value provided
                example: ''
    SuccessMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Success message
          example: 'User deleted successfully'
        timestamp:
          type: string
          format: date-time
          description: When the operation was completed
          example: '2025-07-15T17:30:00.000Z'
    AnalysisChecklistItem:
      type: object
      required:
        - id
        - status
        - weight
        - reason
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PASS, FAIL, UNCERTAIN]
        weight:
          type: integer
        reason:
          type: string
        evidenceRef:
          type: string
    ListingAnalysis:
      type: object
      required:
        - id
        - listingId
        - scope
        - status
        - score
        - items
        - promptVersion
        - idempotencyKey
        - createdAt
      properties:
        id:
          type: string
        listingId:
          type: string
        scope:
          type: string
          enum: [DRAFT, SUBMIT]
        status:
          type: string
          enum: [PENDING, COMPLETED, UNAVAILABLE, FAILED]
        score:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisChecklistItem'
        modelId:
          type: string
        promptVersion:
          type: string
        idempotencyKey:
          type: string
        failureReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
